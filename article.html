<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEWCAPTURE Article</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



body{

background:#050505;

color:white;

font-family:'Inter',sans-serif;

}



.article-header{

padding:120px 8% 50px;

max-width:1200px;

margin:auto;

}



.category{

color:#35ff88;

letter-spacing:5px;

font-size:13px;

}



h1{

font-family:'Space Grotesk';

font-size:clamp(45px,7vw,90px);

line-height:1;

margin-top:25px;

}



.hero-image{

width:85%;

height:600px;

margin:40px auto;

border-radius:30px;

overflow:hidden;

}



.hero-image img{

width:100%;

height:100%;

object-fit:cover;

}



.article-text{

max-width:750px;

margin:80px auto;

padding:0 25px;

}



.article-text p{

font-size:20px;

line-height:1.9;

color:#ccc;

margin-bottom:35px;

}



.back{

color:#35ff88;

text-decoration:none;

font-weight:bold;

}



footer{

text-align:center;

padding:50px;

border-top:1px solid #222;

color:#777;

}



</style>


</head>



<body>



<header class="article-header">


<div class="category" id="category">

</div>


<h1 id="title">

</h1>



</header>





<div class="hero-image">


<img id="image">


</div>





<section class="article-text">


<p id="content">

</p>


<a href="index.html" class="back">

← Späť na články

</a>


</section>






<footer>

NEWCAPTURE © 2026

</footer>







<script>


// ZÍSKANIE ID Z URL


const params = new URLSearchParams(window.location.search);


const id = params.get("id");





// NAČÍTANIE JSON


fetch("data/articles.json")


.then(response => response.json())


.then(articles => {



const article = articles.find(
item => item.id == id
);




if(article){



document.getElementById("category").innerHTML =
article.category;



document.getElementById("title").innerHTML =
article.title;



document.getElementById("image").src =
article.image;



document.getElementById("content").innerHTML =
article.content;



}



else{


document.getElementById("title").innerHTML =
"Článok neexistuje";


}



});



</script>



</body>

</html>
